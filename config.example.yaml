server:
  # TLS control/API/dashboard and TLS data listeners. Use these for WSS agents.
  listen: "0.0.0.0:7000"
  data_listen: "0.0.0.0:7001"
  # Optional plaintext HTTP/WS control and plaintext data listeners.
  # Keep disabled unless you intentionally want ws:// access. Dashboard changes
  # are stored as server overrides and take effect after restarting the service.
  plain_enabled: false
  plain_listen: "0.0.0.0:7004"
  plain_data_listen: "0.0.0.0:7005"
  public_data_address: "127.0.0.1:7001"
  quic_listen: "0.0.0.0:7002"
  public_quic_address: "127.0.0.1:7002"
  rendezvous_listen: "0.0.0.0:7003"
  public_rendezvous_address: "127.0.0.1:7003"
  # Required to enable distributed relay nodes. Use a separate long random secret.
  relay_api_token: ""
  http_listen: "0.0.0.0:8080"
  database: "data/nrynet.db"
  log_directory: "logs"
  jwt_ttl: "12h"
  heartbeat_timeout: "45s"
  tls:
    enabled: true
    cert_file: "/opt/nrynet/tls/fullchain.pem"
    key_file: "/opt/nrynet/tls/privkey.pem"
  bootstrap:
    admin_username: "admin"
    admin_password: ""
client:
  server_url: "wss://127.0.0.1:7000/agent/connect"
  data_address: "127.0.0.1:7001"
  transport: "websocket"
  quic_address: "127.0.0.1:7002"
  rendezvous_address: "127.0.0.1:7003"
  ca_file: "/opt/nrynet/tls/fullchain.pem"
  token: ""
  name: ""
  device_id: ""
  insecure_skip_verify: false
