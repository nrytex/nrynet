server:
  listen: "0.0.0.0:7000"
  data_listen: "0.0.0.0:7001"
  public_data_address: "nat-link.example.com:7001"
  quic_listen: "0.0.0.0:7002"
  public_quic_address: "nat-link.example.com:7002"
  rendezvous_listen: "0.0.0.0:7003"
  public_rendezvous_address: "nat-link.example.com:7003"
  relay_api_token: ""
  http_listen: "0.0.0.0:8080"
  database: "/opt/nat-link/data/nat-link.db"
  log_directory: "/opt/nat-link/logs"
  jwt_ttl: "12h"
  heartbeat_timeout: "45s"
  tls:
    enabled: true
    cert_file: "/opt/nat-link/tls/fullchain.pem"
    key_file: "/opt/nat-link/tls/privkey.pem"
  bootstrap:
    admin_username: "admin"
    admin_password: ""

client:
  server_url: "wss://nat-link.example.com:7000/agent/connect"
  data_address: "nat-link.example.com:7001"
  transport: "websocket"
  quic_address: "nat-link.example.com:7002"
  rendezvous_address: "nat-link.example.com:7003"
  ca_file: ""
  token: ""
  name: ""
  device_id: ""
  insecure_skip_verify: false
